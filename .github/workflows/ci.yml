name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler.name }} (${{ matrix.build_type }}, -Werror)
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc,   cc: gcc,   cxx: g++ }
          - { name: clang, cc: clang, cxx: clang++ }
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTALUS_WARNINGS_AS_ERRORS=ON
          -DTALUS_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-minimums:
    name: linux/${{ matrix.compiler.name }} (${{ matrix.build_type }}, -Werror)
    runs-on: ubuntu-22.04
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-12,   cc: gcc-12,   cxx: g++-12,     major: "12" }
          - { name: clang-15, cc: clang-15, cxx: clang++-15, major: "15" }
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Verify compiler floor
        run: |
          $CC --version
          $CXX --version
          test "$($CXX -dumpversion | cut -d. -f1)" = "${{ matrix.compiler.major }}"
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTALUS_WARNINGS_AS_ERRORS=ON
          -DTALUS_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macos/AppleClang (${{ matrix.build_type }}, -Werror)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTALUS_WARNINGS_AS_ERRORS=ON
          -DTALUS_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-minimum:
    name: macos/AppleClang 15 (${{ matrix.build_type }}, -Werror)
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Verify compiler floor
        run: |
          xcodebuild -version
          clang++ --version
          clang++ --version | grep -E "Apple clang version 15\\."
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTALUS_WARNINGS_AS_ERRORS=ON
          -DTALUS_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows/MSVC (${{ matrix.build_type }}, -WX)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      # The Visual Studio generator is multi-config: CMAKE_BUILD_TYPE is
      # ignored at configure time, so the build type is selected per-step with
      # --config / -C instead.
      - name: Configure
        run: >
          cmake -B build
          -DTALUS_WARNINGS_AS_ERRORS=ON
          -DTALUS_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j
      - name: Test
        # The stress and exception tests self-scale down on MSVC Debug (see
        # talus::test::slow_debug_build), so no per-lane TALUS_STRESS_* override
        # is needed here.
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  windows-minimum:
    name: windows/MSVC 2022 (${{ matrix.build_type }}, -WX)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Visual Studio floor
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $version = & $vswhere -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if (-not $version) {
            throw "Visual Studio 2022 with the C++ toolset was not found"
          }
          Write-Host "Visual Studio 2022 $version"
      # The Visual Studio generator is multi-config: CMAKE_BUILD_TYPE is
      # ignored at configure time, so the build type is selected per-step with
      # --config / -C instead.
      - name: Configure
        run: >
          cmake -B build
          -G "Visual Studio 17 2022"
          -T v143
          -DTALUS_WARNINGS_AS_ERRORS=ON
          -DTALUS_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j
      - name: Test
        # The stress and exception tests self-scale down on MSVC Debug (see
        # talus::test::slow_debug_build), so no per-lane TALUS_STRESS_* override
        # is needed here.
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: clang (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      # Fail the run on any leak or undefined-behavior report.
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DTALUS_ENABLE_SANITIZERS=ON
          -DTALUS_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  valgrind:
    name: valgrind (memcheck)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # Plain (non-sanitized) Debug build: Valgrind and AddressSanitizer are
      # mutually incompatible, so this build must not enable sanitizers.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DTALUS_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build -j
      - name: Run tests under Valgrind
        # --error-exitcode=1 fails the job on any invalid access or use of
        # uninitialized memory (Memcheck's unique contribution over ASan).
        # Only "definite" leaks count as errors, to avoid false positives from
        # libstdc++/global allocations; --track-origins pinpoints uninit reads.
        # The stress test is scaled down: Memcheck makes its oracle diff ~30x
        # slower, and uninitialized-read coverage does not need full scale.
        env:
          TALUS_STRESS_POINTS: "20000"
          TALUS_STRESS_QUERIES: "200"
        run: |
          status=0
          for t in build/tests/talus_*; do
            [ -x "$t" ] || continue
            echo "::group::valgrind $t"
            valgrind --error-exitcode=1 --leak-check=full \
                     --errors-for-leak-kinds=definite \
                     --show-leak-kinds=definite,indirect \
                     --track-origins=yes "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

  consumption:
    name: install and FetchContent consumption
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: Configure package
        run: >
          cmake -B build-package
          -DCMAKE_BUILD_TYPE=Release
          -DTALUS_BUILD_TESTS=OFF
          -DTALUS_BUILD_EXAMPLES=OFF
      - name: Install package
        run: cmake --install build-package --prefix "$PWD/build-package/install"
      - name: Configure installed-package consumer
        run: >
          cmake -S tests/consumer_smoke -B build-consumer-installed
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/build-package/install"
      - name: Build installed-package consumer
        run: cmake --build build-consumer-installed -j
      - name: Test installed-package consumer
        run: ctest --test-dir build-consumer-installed --output-on-failure
      - name: Configure FetchContent consumer
        run: >
          cmake -S tests/consumer_smoke -B build-consumer-fetchcontent
          -DCMAKE_BUILD_TYPE=Release
          -DTALUS_CONSUMER_USE_FETCHCONTENT=ON
          -DTALUS_FETCHCONTENT_SOURCE_DIR="$PWD"
      - name: Build FetchContent consumer
        run: cmake --build build-consumer-fetchcontent -j
      - name: Test FetchContent consumer
        run: ctest --test-dir build-consumer-fetchcontent --output-on-failure
